<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris AI Dashboard</title>
    <meta name="description" content="Iris AI: Your intelligent fine-tuned assistant, trained on your data.">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="header-row">
            <button class="icon-btn" id="toggleBtn" aria-label="Toggle sidebar">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <div class="brand-wrapper">
                <img src="{{ url_for('static', filename='iris_logo.png') }}" alt="Iris AI" class="iris-logo" onerror="this.style.display='none'">
                <span class="iris-name nav-text">Iris AI</span>
            </div>
            <button class="icon-btn nav-text search-btn" id="searchToggleBtn" aria-label="Search chats">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
        </div>

        <div class="sidebar-content">
            <div class="nav-item" id="newChatBtn" aria-label="New chat">
                <svg class="main-icon pen-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                <span class="nav-text">New chat</span>
            </div>
        </div>

        <div class="search-bar-container" id="searchBarContainer">
            <div class="search-bar-inner">
                <svg class="search-bar-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" class="search-bar-input" placeholder="Search chats..." autocomplete="off" spellcheck="false">
                <button class="search-clear-btn" id="searchClearBtn" aria-label="Clear search">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
        </div>

        <div class="recent-section nav-text">
            <p class="section-label" id="recentLabel">Recent Chats</p>
            <div class="chat-history" id="chatHistory"></div>
            <p class="search-empty" id="searchEmpty">No chats match your search.</p>
        </div>

        <div class="sidebar-footer">
            <div class="nav-item" id="settingsBtn" aria-label="Settings">
                <svg class="main-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                <span class="nav-text">Settings</span>
            </div>
        </div>
    </aside>

    <main class="main-content" id="mainContent">

        <div class="chat-messages" id="chatMessages"></div>

        <div class="center-panel" id="centerPanel">
            <div class="welcome-section" id="welcomeSection">
                <h1 class="hi-text" id="greetingText">Hi</h1>
                <p class="sub-text">What's on your mind today?</p>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <input type="text" id="chatInput" placeholder="Ask anything" autocomplete="off">
                    <button class="send-btn" id="sendBtn" aria-label="Send message">
                        <h3>&nbsp;➤&nbsp;</h3>
                    </button>
                </div>
                <p class="footere" id="footerText">Iris AI can make mistakes. Check important info.</p>
            </div>
        </div>
    </main>

    <!-- ═══════════════════════════════════════════
         SETTINGS PANEL (slides in from right)
    ════════════════════════════════════════════ -->
    <div class="settings-overlay" id="settingsOverlay"></div>

    <aside class="settings-panel" id="settingsPanel" aria-label="Settings">
        <div class="settings-header">
            <h2 class="settings-title">Settings</h2>
            <button class="icon-btn" id="closeSettingsBtn" aria-label="Close settings">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>

        <div class="settings-tabs">
            <button class="stab-btn active" id="stab-chat" data-tab="chat">Chat</button>
            <button class="stab-btn" id="stab-training" data-tab="training">Training</button>
        </div>

        <!-- CHAT SETTINGS TAB -->
        <div class="settings-tab-content active" id="stab-content-chat">
            <p class="settings-section-label">Generation</p>

            <div class="settings-field">
                <label for="cs_max_new_tokens">
                    <div style="display:flex; justify-content:space-between; align-items:center; width: 100%;">
                        <span>Max New Tokens</span>
                        <span id="val_max_new_tokens" style="color:var(--iris-purple); font-weight:bold;">40</span>
                    </div>
                    <span class="field-hint">Number of tokens the model generates per reply.</span>
                </label>
                <input type="range" id="cs_max_new_tokens" value="40" min="1" max="4096" oninput="document.getElementById('val_max_new_tokens').innerText = this.value">
            </div>

            <div class="settings-field">
                <label for="cs_temperature">
                    <div style="display:flex; justify-content:space-between; align-items:center; width: 100%;">
                        <span>Temperature</span>
                        <span id="val_temperature" style="color:var(--iris-purple); font-weight:bold;">0.6</span>
                    </div>
                    <span class="field-hint">Higher = more creative. Lower = more predictable.</span>
                </label>
                <input type="range" id="cs_temperature" value="0.6" step="0.05" min="0.01" max="2" oninput="document.getElementById('val_temperature').innerText = this.value">
            </div>

            <div class="settings-field">
                <label for="cs_top_p">
                    <div style="display:flex; justify-content:space-between; align-items:center; width: 100%;">
                        <span>Top P</span>
                        <span id="val_top_p" style="color:var(--iris-purple); font-weight:bold;">0.9</span>
                    </div>
                    <span class="field-hint">Nucleus sampling threshold.</span>
                </label>
                <input type="range" id="cs_top_p" value="0.9" step="0.05" min="0" max="1" oninput="document.getElementById('val_top_p').innerText = this.value">
            </div>

            <div class="settings-field">
                <label for="cs_top_k">
                    <div style="display:flex; justify-content:space-between; align-items:center; width: 100%;">
                        <span>Top K</span>
                        <span id="val_top_k" style="color:var(--iris-purple); font-weight:bold;">40</span>
                    </div>
                    <span class="field-hint">Limits vocabulary to the top K likely tokens.</span>
                </label>
                <input type="range" id="cs_top_k" value="40" min="1" max="200" oninput="document.getElementById('val_top_k').innerText = this.value">
            </div>

            <div class="settings-field">
                <label for="cs_repetition_penalty">
                    <div style="display:flex; justify-content:space-between; align-items:center; width: 100%;">
                        <span>Repetition Penalty</span>
                        <span id="val_repetition_penalty" style="color:var(--iris-purple); font-weight:bold;">1.3</span>
                    </div>
                    <span class="field-hint">Penalizes repeating words. 1.05–1.3 works well.</span>
                </label>
                <input type="range" id="cs_repetition_penalty" value="1.3" step="0.05" min="1" max="2" oninput="document.getElementById('val_repetition_penalty').innerText = this.value">
            </div>

            <button class="settings-save-btn" id="saveChatSettingsBtn">Save Chat Settings</button>
        </div>

        <!-- TRAINING SETTINGS TAB -->
        <div class="settings-tab-content" id="stab-content-training">
            <div class="training-subtabs">
                <button class="training-subtab active" id="tsub-params" data-tsub="params">Parameters</button>
                <button class="training-subtab" id="tsub-logs" data-tsub="logs">Live Logs</button>
            </div>

            <!-- PARAMETERS -->
            <div class="tsub-content active" id="tsub-content-params">
                <p class="settings-section-label">Model</p>

                <div class="settings-field">
                    <label for="modelNameInput">Model Name</label>
                    <input type="text" id="modelNameInput" value="google/gemma-2-2b-it">
                </div>

                <p class="settings-section-label" style="margin-top:20px">Hyperparameters</p>

                <div class="settings-field-row">
                    <div class="settings-field">
                        <label for="epochsInput">Epochs</label>
                        <input type="number" id="epochsInput" value="3">
                    </div>
                    <div class="settings-field">
                        <label for="lrInput">Learning Rate</label>
                        <input type="text" id="lrInput" value="2e-4">
                    </div>
                </div>

                <div class="settings-field-row">
                    <div class="settings-field">
                        <label for="batchSizeInput">Batch Size</label>
                        <input type="number" id="batchSizeInput" value="1">
                    </div>
                    <div class="settings-field">
                        <label for="accumInput">Accum Steps</label>
                        <input type="number" id="accumInput" value="8">
                    </div>
                </div>

                <div class="settings-field-row">
                    <div class="settings-field">
                        <label for="maxLengthInput">Max Length</label>
                        <input type="number" id="maxLengthInput" value="64">
                    </div>
                    <div class="settings-field">
                        <label for="maxPairsInput">Max Pairs</label>
                        <input type="number" id="maxPairsInput" value="5000">
                    </div>
                </div>

                <p class="settings-section-label" style="margin-top:20px">Dataset</p>

                <div class="settings-field">
                    <label for="mdDirInput">Markdown Dir</label>
                    <input type="text" id="mdDirInput" value="training">
                </div>

                <p class="settings-section-label" style="margin-top:20px">Device &amp; Flags</p>

                <div class="settings-field">
                    <label for="deviceInput">Device</label>
                    <select id="deviceInput">
                        <option value="">Auto (CUDA / MPS)</option>
                        <option value="cpu">Force CPU</option>
                        <option value="mps">Force MPS</option>
                        <option value="cuda">Force CUDA</option>
                    </select>
                </div>

                <div class="toggle-group">
                    <label class="toggle-label">
                        <input type="checkbox" id="noBstInput">
                        <span class="toggle-track"></span>
                        Disable BST
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="noDdInput">
                        <span class="toggle-track"></span>
                        Disable DailyDialog
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="noMdInput">
                        <span class="toggle-track"></span>
                        Disable Markdown Data
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="useChatTemplateInput">
                        <span class="toggle-track"></span>
                        Use Chat Template
                    </label>
                </div>

                <p class="settings-section-label" style="margin-top:20px">Reasoning Datasets</p>
                <div class="settings-field-row">
                    <div class="settings-field">
                        <label for="claudeReasoningInput">Claude Reasoning (Pairs)</label>
                        <input type="number" id="claudeReasoningInput" value="0">
                    </div>
                    <div class="settings-field">
                        <label for="dolciThinkInput">Dolci Think (Pairs)</label>
                        <input type="number" id="dolciThinkInput" value="0">
                    </div>
                </div>
                <div class="settings-field">
                    <label for="deepthinkInput">Deepthink Reasoning (Pairs)</label>
                    <input type="number" id="deepthinkInput" value="0">
                </div>
                <div class="toggle-group">
                    <label class="toggle-label">
                        <input type="checkbox" id="stripReasoningInput">
                        <span class="toggle-track"></span>
                        Strip Reasoning (<think> blocks)
                    </label>
                </div>

                <div class="training-actions">
                    <button class="settings-save-btn" id="startTrainingBtn">Start Training</button>
                    <button class="stop-training-btn" id="stopTrainingBtn" disabled>Stop Training</button>
                </div>
            </div>

            <!-- LIVE LOGS -->
            <div class="tsub-content" id="tsub-content-logs">
                <div class="log-area" id="trainLogs">Ready to train...</div>
            </div>
        </div>
    </aside>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script src="{{ url_for('static', filename='scriptchat.js') }}"></script>
    <script src="{{ url_for('static', filename='settings.js') }}"></script>
</body>
</html>
